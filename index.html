<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e4a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<style>html{color-scheme:light dark}body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.editor .note-i{flex:1 1 180px}.editor .amt-i{width:130px}
</style>

<body>
<title>Sổ Thu Chi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bảng điều khiển: thanh bên xanh lục đậm, thẻ số liệu gradient, bảng giao dịch viền nét đứt, biểu đồ nhiều màu. Điện thoại dùng thanh điều hướng dưới. */
:root{
  --page:#dcf1e7; --panel:#eef9f4; --surface:#ffffff; --surface2:#e8f4ed; --ink:#0f2a20; --ink2:#678074; --line:#d6e8dd;
  --bg1:#dcf1e7; --bg2:#eef9f4;
  --accent:#0f7a4d; --accent-d:#0b5a3c; --accent-ink:#ffffff; --teal:#19d3a6;
  --pos:#1b9a5a; --neg:#e0493a; --amber:#f2b01e;
  --side1:#1f7a57; --side2:#0c3f30;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(15,60,40,.05),0 10px 28px rgba(15,60,40,.08);
  --glass:rgba(255,255,255,.9);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#07110d; --panel:#0d1b15; --surface:#14261f; --surface2:#1c3128; --ink:#e6f1ea; --ink2:#8fa89b; --line:#223a30;
  --bg1:#07110d; --bg2:#0d1b15; --accent:#34c58a; --accent-d:#1f9a68; --accent-ink:#04201a; --pos:#4cc58a; --neg:#ff7a68;
  --side1:#17543c; --side2:#082a20; --shadow:none; --glass:rgba(20,38,31,.92); color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#07110d; --panel:#0d1b15; --surface:#14261f; --surface2:#1c3128; --ink:#e6f1ea; --ink2:#8fa89b; --line:#223a30;
  --bg1:#07110d; --bg2:#0d1b15; --accent:#34c58a; --accent-d:#1f9a68; --accent-ink:#04201a; --pos:#4cc58a; --neg:#ff7a68;
  --side1:#17543c; --side2:#082a20; --shadow:none; --glass:rgba(20,38,31,.92); color-scheme:dark;}
*{box-sizing:border-box}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%);background-color:var(--bg2);background-attachment:fixed;color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;
  padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums}
.app{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0a4f35,#17894f);color:#fff;display:grid;place-items:center}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{color:var(--ink2);font-size:12.5px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2)}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec-h h2{margin:0}
.link{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.vw{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0a4f35 0%,#127a4c 100%);box-shadow:0 10px 28px rgba(10,79,53,.28)}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 70%)}
.hero::after{content:"";position:absolute;right:30px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .l{font-size:13px;opacity:.85}
.hero .big{font-size:clamp(32px,8vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 8px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.17);font-size:12.5px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.hero .mini span{display:block;font-size:11.5px;opacity:.8}
.hero .mini b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.hero .nw{margin-top:10px;font-size:12.5px;opacity:.9}
/* entry */
.entry{display:flex;flex-direction:column;gap:10px}
.entry .r{display:flex;gap:8px}
.entry input{flex:1;min-width:0;border:1.5px solid transparent;background:var(--surface2);border-radius:14px;padding:13px 15px;font-size:16px}
.entry input:focus{border-color:var(--accent);outline:0}
.go{border:0;border-radius:14px;background:var(--accent-d);color:#fff;font-weight:600;padding:0 22px}
.pv{display:flex;flex-direction:column;gap:6px}
.pv:empty{display:none}
.pvi{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:13.5px}
.pvi b{font-weight:600}
.pvi .m{color:var(--ink2)}
/* rows */
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>.tx:first-child,.list>.grp+.tx{border-top:0}
.tx .t{font-weight:600;overflow-wrap:anywhere}
.tx .s{font-size:12.5px;color:var(--ink2)}
.tx .a{font-weight:600;text-align:right;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.grp{font-size:13px;font-weight:600;color:var(--ink2);padding:14px 0 2px}
.editor{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0 12px 54px}
.editor select,.editor input{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 10px;font-size:13.5px;max-width:100%}
.editor .del{border:0;background:transparent;color:var(--neg);font-weight:500;padding:6px 8px}
.empty{color:var(--ink2);padding:22px 8px;text-align:center}
/* pills & period */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:0;border-radius:99px;padding:8px 18px;background:var(--surface);color:var(--ink2);font-weight:500;box-shadow:var(--shadow)}
.pills button[aria-pressed=true]{background:var(--accent-d);color:#fff}
.period{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:8px}
.nav b{min-width:116px;text-align:center;font-weight:600}
.nav button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--ink2)}
.tot .l{font-size:13px;color:var(--ink2)}
.tot .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.tot .d{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:13px;box-shadow:var(--shadow);min-width:0}
.kpi span{font-size:12px;color:var(--ink2);display:block}
.kpi b{font-size:clamp(14px,3.4vw,18px);font-weight:600;overflow-wrap:anywhere}
.donut-wrap{display:flex;justify-content:center;margin:6px 0 10px}
.donut{width:220px;height:220px;max-width:100%}
.lg{display:grid;grid-template-columns:42px 1fr auto auto;gap:4px 12px;align-items:center;padding:9px 6px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;border-radius:0}
.lg.sel{background:var(--surface2);border-radius:12px}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.lg .p{color:var(--ink2);font-size:13px}
.lg .a{font-weight:600;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-family:var(--font);font-size:11px}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:600}
.invs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.invs>div{background:var(--surface2);border-radius:14px;padding:11px;min-width:0}
.invs small{color:var(--ink2);display:flex;align-items:center;gap:6px}
.invs b{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.cur{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 10px;font-size:13.5px;width:150px;max-width:100%}
.banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.banner button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:6px 14px;font-weight:500}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--ink2)}
.tab[aria-current=page]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#0d6a43,#1ca163);color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 8px 20px rgba(13,106,67,.4);border:4px solid var(--bg2)}
.fab.on{background:var(--neg);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.fab.on{animation:none}}
.listen{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:18;background:var(--surface);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.2);border-radius:18px;padding:12px 16px;width:min(420px,calc(100% - 32px))}
.listen small{color:var(--neg);font-weight:600;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#10261c;color:#fff;padding:11px 14px;border-radius:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.toast button{background:transparent;border:0;color:#6fe0ac;font-weight:600;white-space:nowrap}
.backup p{margin:0 0 8px;color:var(--ink2);font-size:13px}
.backup textarea{width:100%;min-height:100px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.backup .b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 16px;color:var(--ink2)}
.gh{display:grid;grid-template-columns:12px 1fr auto auto;gap:4px 10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 6px 6px;text-align:left;border-radius:0}
.gh b{font-size:14px;font-weight:600}
.gh.sel{background:var(--surface2);border-radius:12px}
.gh .p,.gh .a{font-size:13px}.gh .a{font-weight:600;white-space:nowrap}.gh .p{color:var(--ink2)}
.gdot{width:12px;height:12px;border-radius:4px}
.lg{grid-template-columns:34px 1fr auto auto;border-top:0;padding:5px 6px 5px 18px;border-radius:12px}
.lg .a{font-size:13.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ri{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0;max-width:100%}
.ri.nm{flex:1 1 100%}.ri.am{flex:1 1 120px}.ri.dayi{width:62px}
.rec>select.ri{flex:1 1 160px}
.rd{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2)}
.rx{border:0;background:transparent;color:var(--ink2);font-size:20px;width:32px;height:32px;border-radius:8px}
.rx:hover{color:var(--neg)}
.memo{display:block;font-style:italic;margin-top:1px}
.memo-i{flex:1 1 100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px}
.detail{background:var(--surface2);border-radius:16px;padding:10px 14px 4px;margin:4px 0 10px}
.detail .dh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;padding-bottom:6px}
.detail .tx{padding:8px 0}
.detail .editor{padding-left:0}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}

/* ---- bảng điều khiển ---- */
body{padding-block:16px 120px}
.stage{max-width:1320px;margin:0 auto}
.side{display:none}
.main{min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hb{display:flex;gap:8px}
.vw{display:flex;flex-direction:column;gap:16px;min-width:0}
.sc3{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 16px;margin:0 -2px -6px}
.sc{flex:0 0 80%;scroll-snap-align:start;position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;color:#fff;min-height:122px;box-shadow:0 12px 26px rgba(10,60,40,.22)}
.sc::before{content:"";position:absolute;right:-30px;top:-44px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),rgba(255,255,255,0) 70%)}
.sc.g1{background:linear-gradient(135deg,#2c9a74 0%,#0f5a41 100%)}
.sc.g2{background:linear-gradient(135deg,#a9bf3a 0%,#58761a 100%)}
.sc.g3{background:linear-gradient(135deg,#4f86d0 0%,#5b3a93 100%)}
.sct{font-size:15px;font-weight:600;position:relative}
.scv{font-size:clamp(22px,6vw,28px);font-weight:700;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere;max-width:82%;position:relative}
.scs{font-size:12.5px;opacity:.92;margin-top:6px;max-width:78%;position:relative}
.scart{position:absolute;right:-10px;bottom:-18px;color:rgba(255,255,255,.18)}.scart svg{width:92px;height:92px}
.row2,.row3,.an{display:grid;gap:16px;align-items:start;grid-template-columns:minmax(0,1fr)}
.stackc{display:flex;flex-direction:column;gap:16px;min-width:0}
.card small{color:var(--ink2);font-size:12.5px}
.th,.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.th{font-size:12.5px;color:var(--ink2);padding:8px 4px;display:none}
.tr{width:100%;text-align:left;border:0;border-top:1.5px dashed var(--line);background:transparent;padding:12px 4px;cursor:pointer}
.c1{display:flex;gap:10px;align-items:center;min-width:0}
.tt{display:flex;flex-direction:column;min-width:0}
.tt b{font-weight:600;overflow-wrap:anywhere}
.tt em{font-size:12.5px;color:var(--ink2);font-style:italic}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);max-width:100%;overflow-wrap:anywhere}
.c3{font-size:13px;color:var(--ink2)}
.c4{text-align:right;font-weight:600;white-space:nowrap}
.tr .c1{grid-column:1}.tr .c4{grid-column:2;grid-row:1}.tr .c2{grid-column:1}.tr .c3{grid-column:2;text-align:right}
.trs .grp{padding:14px 4px 6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 10px}
.sq{flex:1 1 220px;min-width:0;border:1.5px solid transparent;background:var(--surface2);border-radius:99px;padding:10px 16px;font-size:15px}
.sq:focus{border-color:var(--accent);outline:0}
.toolbar .pills button{box-shadow:none;background:var(--surface2)}
.toolbar .pills button[aria-pressed=true]{background:var(--accent-d)}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.sumrow b{font-weight:600}
.entry .micb{width:48px;flex:none;border-radius:50%;border:0;background:linear-gradient(135deg,#0d6a43,#1ca163);color:#fff;display:grid;place-items:center}
.micb.on,.sidemic.on{background:var(--neg)!important;animation:pulse 1s infinite}
.entry input{border-radius:99px;padding:13px 18px}
.go{border-radius:99px}
.mlg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mlg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.mlg i{width:12px;height:12px;border-radius:4px;display:block}
.donut.sm{width:190px;height:190px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 6px}
.strip>div{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.strip span{display:block;font-size:12px;color:var(--ink2)}
.strip b{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.tr2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;border-top:1.5px dashed var(--line);padding:12px 4px}
.tr2 .cv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px}
.nx{flex:1 1 100%;font-size:12.5px;color:var(--ink2)}
.hint{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.st{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-bottom:6px}
.st b{font-weight:600}
@media (min-width:700px){.th,.tr{grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1.1fr)}.th{display:grid}.tr .c1{grid-column:auto}.tr .c4{grid-column:auto;grid-row:auto}.tr .c2{grid-column:auto}.tr .c3{grid-column:auto;text-align:left}}
@media (min-width:900px){
  .row2{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
  .row3{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
  .an{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}

function genRec(){
  var td=today(),n=0,cm=td.slice(0,7);

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}
function blank(w,a,b){return w.slice(0,a)+new Array(b-a+1).join(' ')+w.slice(b);}
var UNIT={ty:1e9,trieu:1e6,tr:1e6,cu:1e6,nghin:1e3,ngan:1e3,k:1e3,dong:1,vnd:1,d:1};
function wordsToNum(tk){
  var D={khong:0,mot:1,hai:2,ba:3,bon:4,tu:4,nam:5,lam:5,sau:6,bay:7,tam:8,chin:9};
  var SC={nghin:1e3,ngan:1e3,trieu:1e6,cu:1e6,ty:1e9};
  var total=0,group=0,pend=null,last=0,i,t;
  for(i=0;i<tk.length;i++){t=tk[i];
    if(D.hasOwnProperty(t))pend=D[t];
    else if(t==='muoi'||t==='chuc'){group+=(pend==null?1:pend)*10;pend=null;}
    else if(t==='tram'){group+=(pend==null?1:pend)*100;pend=null;}
    else if(SC.hasOwnProperty(t)){group+=pend||0;pend=null;if(group===0)return 0;total+=group*SC[t];group=0;last=SC[t];}
    else if(t==='ruoi'){if(last)total+=last/2;pend=null;}
  }
  var rem=group+(pend||0);
  if(rem>0){
    if(last){if(rem<10)total+=rem*last/10;else if(rem<100)total+=rem*last/100;else total+=rem*last/1000;}
    else total+=rem;
  }
  return total;
}
function extractAmount(w){
  var re=/(\d+(?:[.,]\d+)*)\s*(ty|trieu|tr|cu|nghin|ngan|k|dong|vnd|d)?(?![a-z])/g,m,c=[];
  while((m=re.exec(w))){
    var tok=m[1],u=m[2],num,a=m.index;
    if(/^\d{1,3}([.,]\d{3})+$/.test(tok))num=parseFloat(tok.replace(/[.,]/g,''));
    else num=parseFloat(tok.replace(',','.'));
    if(isNaN(num))continue;
    var mult=u?UNIT[u]:1,v=num*mult;
    if(u&&mult>=1e3){
      var tail=w.slice(re.lastIndex),t;
      if((t=/^\s*ruoi\b/.exec(tail))){v+=mult/2;re.lastIndex+=t[0].length;}
      else if((t=/^\s*(\d{1,3})(?![\d.,a-z])/.exec(tail))&&tok.indexOf('.')<0&&tok.indexOf(',')<0){
        v+=parseInt(t[1],10)*mult/Math.pow(10,t[1].length);re.lastIndex+=t[0].length;}
    }
    var guess=false;if(!u&&v<1000){v*=1000;guess=true;}
    c.push({v:v,unit:!!u,a:a,b:re.lastIndex});
  }
  var withUnit=c.filter(function(x){return x.unit;});
  function maxOf(l){return l.reduce(function(a,b){return b.v>a.v?b:a;});}
  if(withUnit.length)return maxOf(withUnit);
  var wr=/(?:(?:khong|mot|hai|ba|bon|tu|nam|lam|sau|bay|tam|chin|muoi|chuc|tram|linh|le|nghin|ngan|trieu|ty|ruoi|cu)\b\s*)+/g,words=[];
  while((m=wr.exec(w))){
    var txt=m[0].replace(/\s+$/,''),val=wordsToNum(txt.split(/\s+/));
    if(val>0&&/\b(nghin|ngan|trieu|ty|cu|tram)\b/.test(txt))words.push({v:val,a:m.index,b:m.index+txt.length});
  }
  if(words.length)return maxOf(words);
  return c.length?maxOf(c):null;
}

function extractWhen(w0,ctx){

  return GROUPS.map(function(g){return '<optgroup label="'+esc((g.type==='thu'?'Thu · ':'Chi · ')+g.name)+'">'+g.cats.map(function(c){var v=g.type+'|'+c[0];return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(c[0])+'</option>';}).join('')+'</optgroup>';}).join('');
}
function txRow(t,withDay){
  var cls=t.type==='thu'?'pos':t.type==='chi'?'neg':'',amt=(t.type==='thu'?'+ ':'− ')+money(t.amount);
  var sub=esc(t.cat)+' · '+(withDay?dayLabel(t.date)+', ':'')+(t.time||'');
  var h='<button class="tx" data-act="edit" data-id="'+t.id+'">'+tile(t.cat)+'<span><span class="t" style="display:block">'+esc(t.note)+'</span><span class="s">'+sub+'</span>'+(t.memo?'<span class="s memo">“'+esc(t.memo)+'”</span>':'')+'</span><span class="a '+cls+'">'+amt+'</span></button>';
  if(S.edit===t.id)h+='<div class="editor"><input type="text" class="note-i" data-act="note" data-id="'+t.id+'" value="'+esc(t.note||'')+'" placeholder="Tên khoản" aria-label="Tên khoản"><input type="text" inputmode="numeric" class="amt-i" data-act="amt" data-id="'+t.id+'" value="'+t.amount+'" placeholder="Số tiền" aria-label="Số tiền (VND)"><select data-act="cat" data-id="'+t.id+'" aria-label="Nhóm">'+catOptions(t.type+'|'+t.cat)+'</select><input type="date" data-act="date" data-id="'+t.id+'" value="'+t.date+'" aria-label="Ngày"><input type="time" data-act="time" data-id="'+t.id+'" value="'+(t.time||'')+'" aria-label="Giờ"><input type="text" class="memo-i" data-act="memo" data-id="'+t.id+'" value="'+esc(t.memo||'')+'" placeholder="Ghi chú (không bắt buộc)" aria-label="Ghi chú"><button class="del" data-act="del" data-id="'+t.id+'">Xóa khoản này</button></div>';
  return h;
}
function sampleBanner(){
  if(!S.tx.length)return '<div class="banner"><span>Chưa có giao dịch nào. Bạn có thể xem thử với dữ liệu mẫu.</span><button data-act="sample">Xem dữ liệu mẫu</button></div>';
  if(S.tx.some(function(t){return t.sample;}))return '<div class="banner"><span>Sổ đang có dữ liệu mẫu.</span><button data-act="clearsample">Xóa dữ liệu mẫu</button></div>';
  return '';
}
var AB={t:null};
function abOpen(cb){try{var r=indexedDB.open('thuchi-auto',1);r.onupgradeneeded=function(){r.result.createObjectStore('s',{keyPath:'k'});};r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function autoSnap(){clearTimeout(AB.t);AB.t=setTimeout(function(){if(!S.tx.length&&!REC.length)return;abOpen(function(db){if(!db)return;try{var st=db.transaction('s','readwrite').objectStore('s'),json=backupText(),rec={at:Date.now(),json:json,n:S.tx.length};
rec.k='latest';st.put(rec);var r2={at:rec.at,json:json,n:rec.n,k:'d'+today()};st.put(r2);
st.getAllKeys().onsuccess=function(e){var ks=e.target.result.filter(function(k){return k.charAt(0)==='d';}).sort();while(ks.length>14)st.delete(ks.shift());};}catch(e){}});},700);}
function renderAuto(){var el=document.getElementById('autolist');if(!el)return;abOpen(function(db){if(!db){el.innerHTML='<p class="hint">Trình duyệt này không hỗ trợ bản tự lưu.</p>';return;}
db.transaction('s').objectStore('s').getAll().onsuccess=function(e){var rows=(e.target.result||[]).filter(function(r){return r.k!=='latest';}).sort(function(a,b){return b.k<a.k?-1:1;});
if(!rows.length){el.innerHTML='<p class="hint">Chưa có bản tự lưu. Bản đầu tiên sẽ xuất hiện ngay khi bạn nhập khoản đầu tiên.</p>';return;}
el.innerHTML=rows.map(function(r){var d=new Date(r.at);return '<div class="arow"><span><b>'+r.k.slice(1).split('-').reverse().join('/')+'</b> · '+r.n+' giao dịch · lúc '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</span><button class="ghost" data-act="abrestore" data-k="'+r.k+'">Khôi phục</button></div>';}).join('');};});}
function lastBackup(){try{return localStorage.getItem('thuchi.lb')||'';}catch(e){return '';}}
function markBackup(){try{localStorage.setItem('thuchi.lb',today());}catch(e){}}
function backupNudge(){
  if(!S.tx.some(function(t){return !t.sample;})||SY.on)return '';
  var lb=lastBackup(),days=lb?Math.floor((new Date(today())-new Date(lb))/864e5):null;
  if(lb&&days<=14)return '';
  return '<div class="banner"><span>'+(lb?'Đã '+days+' ngày chưa sao lưu dữ liệu.':'Bạn chưa sao lưu dữ liệu lần nào.')+' Sao lưu một lần để không lo mất sổ.</span><button data-act="nav" data-v="backup">Sao lưu ngay</button></div>';
}
function scard(cls,title,val,sub,ic){return '<div class="sc '+cls+'"><div class="sct">'+title+'</div><div class="scv">'+val+'</div><div class="scs">'+sub+'</div><span class="scart">'+icon(ic,104)+'</span></div>';}
function cmpTxt(cur,prev){if(!prev)return 'Chưa có dữ liệu kỳ trước';var ch=(cur-prev)/prev*100;return (ch>=0?'↑ ':'↓ ')+Math.abs(ch).toFixed(1).replace('.',',')+'% so với tháng trước';}
function editorHtml(t){
  return '<div class="editor"><input type="text" class="note-i" data-act="note" data-id="'+t.id+'" value="'+esc(t.note||'')+'" placeholder="Tên khoản" aria-label="Tên khoản"><input type="text" inputmode="numeric" class="amt-i" data-act="amt" data-id="'+t.id+'" value="'+t.amount+'" placeholder="Số tiền" aria-label="Số tiền (VND)"><select data-act="cat" data-id="'+t.id+'" aria-label="Nhóm">'+catOptions(t.type+'|'+t.cat)+'</select><input type="date" data-act="date" data-id="'+t.id+'" value="'+t.date+'" aria-label="Ngày"><input type="time" data-act="time" data-id="'+t.id+'" value="'+(t.time||'')+'" aria-label="Giờ"><input type="text" class="memo-i" data-act="memo" data-id="'+t.id+'" value="'+esc(t.memo||'')+'" placeholder="Ghi chú (không bắt buộc)" aria-label="Ghi chú"><button class="del" data-act="del" data-id="'+t.id+'">Xóa khoản này</button></div>';
}
function trow(t){
  var cls=t.type==='thu'?'pos':t.type==='chi'?'neg':'',amt=(t.type==='thu'?'+ ':'− ')+money(t.amount),m=META[t.cat]||['dots','#94a3b8','#64748b'];
  var h='<button class="tr" data-act="edit" data-id="'+t.id+'"><span class="c1">'+tile(t.cat,40)+'<span class="tt"><b>'+esc(t.note)+'</b>'+(t.memo?'<em>“'+esc(t.memo)+'”</em>':'')+'</span></span><span class="c2"><span class="chip" style="--c:'+m[2]+'">'+esc(t.cat)+'</span></span><span class="c3">'+dayLabel(t.date)+(t.time?' · '+t.time:'')+'</span><span class="c4 '+cls+'">'+amt+'</span></button>';
  if(S.edit===t.id)h+=editorHtml(t);
  return h;
}
var TH='<div class="th"><span>Khoản</span><span>Nhóm</span><span>Thời gian</span><span style="text-align:right">Số tiền</span></div>';
function donutSvg(es,lbl,val){
  var total=es.reduce(function(a,e){return a+e.value;},0),R=72,C=2*Math.PI*R,off=0,segs='',gap=es.length>1?3:0;
  es.forEach(function(e){var f=e.value/total,len=Math.max(f*C-gap,0.5);
    segs+='<circle cx="100" cy="100" r="72" fill="none" stroke="'+e.color+'" stroke-width="24" stroke-dasharray="'+len.toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 100 100)"><title>'+esc(e.name)+': '+money(e.value)+'</title></circle>';off+=f*C;});
  return '<svg class="donut sm" viewBox="0 0 200 200" role="img" aria-label="Biểu đồ tròn"><circle cx="100" cy="100" r="72" fill="none" stroke="var(--surface2)" stroke-width="24"/>'+segs+
    '<text x="100" y="95" text-anchor="middle" style="font-size:11px;fill:var(--ink2);font-family:var(--font)">'+esc(lbl)+'</text><text x="100" y="118" text-anchor="middle" style="font-size:18px;font-weight:700;fill:var(--ink);font-family:var(--font)">'+short(val)+'</text></svg>';
}
function legendMini(es){var total=es.reduce(function(a,e){return a+e.value;},0);return '<div class="mlg">'+es.map(function(e){return '<div><i style="background:'+e.color+'"></i><span>'+esc(e.name)+'</span><b>'+Math.round(e.value/total*100)+'%</b></div>';}).join('')+'</div>';}
function chiShare(list){
  var l=chiAll(list),es=[];
  GROUPS.forEach(function(g){if(g.type==='thu')return;var v=sum(l.filter(function(t){return g.cats.some(function(c){return c[0]===t.cat;});}));if(v>0)es.push({name:g.name,value:v,color:HUES[g.hue].base});});
  if(!es.length)return '<div class="empty">Chưa có khoản chi trong tháng này.</div>';
  es.sort(function(a,b){return b.value-a.value;});
  return '<div class="donut-wrap">'+donutSvg(es,'Tổng chi',sum(l))+'</div>'+legendMini(es);
}
function barMini(n){
  var now=new Date(),ms=[],i;
  for(i=n-1;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({y:d.getFullYear(),m:d.getMonth()+1,thu:0,chi:0});}
  S.tx.forEach(function(t){var y=+t.date.slice(0,4),m=+t.date.slice(5,7);ms.forEach(function(x){if(x.y===y&&x.m===m){if(t.type==='thu')x.thu+=t.amount;else x.chi+=t.amount;}});});
  var mx=niceMax(Math.max.apply(null,ms.map(function(x){return x.thu;}).concat(ms.map(function(x){return x.chi;})))),W=420,H=240,L=44,R=6,T=12,B=26,slot=(W-L-R)/n,bw=Math.min(slot*0.28,18),g='',bars='',k;
  function Y(v){return T+(H-T-B)*(1-v/mx);}
  for(k=0;k<=4;k++){var gv=mx*k/4,gy=Y(gv);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end">'+short(gv)+'</text>';}
  ms.forEach(function(x,i){
    var cx=L+slot*(i+.5),base=H-B;
    function bar(v,xx,col){var h=Math.max(base-Y(v),v>0?2:0);return h>0?'<rect x="'+xx.toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="'+col+'"><title>'+money(v)+'</title></rect>':'';}
    bars+=bar(x.thu,cx-bw-2,'var(--pos)')+bar(x.chi,cx+2,'var(--neg)')+'<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">T'+x.m+'</text>';
  });
  return '<div class="stats" style="margin:0 0 6px"><span><i class="sw" style="background:var(--pos)"></i>Thu</span><span><i class="sw" style="background:var(--neg)"></i>Chi</span></div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Thu chi '+n+' tháng gần đây">'+g+bars+'</svg>';
}
function lineTrend(y){
  var thu=[],chi=[],dt=[],i;for(i=0;i<12;i++){thu.push(0);chi.push(0);dt.push(0);}
  S.tx.forEach(function(t){if(+t.date.slice(0,4)!==y)return;var mi=+t.date.slice(5,7)-1;if(t.type==='thu')thu[mi]+=t.amount;else{chi[mi]+=t.amount;if(t.type==='dautu')dt[mi]+=t.amount;}});
  var now=new Date(),lastM=y===now.getFullYear()?now.getMonth()+1:(y<now.getFullYear()?12:0);
  if(!lastM)return '<div class="empty">Chưa có dữ liệu cho năm này.</div>';
  var mx=niceMax(Math.max.apply(null,thu.concat(chi,dt))),W=640,H=250,L=48,R=14,T=14,B=26;
  function X(i){return L+(W-L-R)*i/11;}function Y(v){return T+(H-T-B)*(1-v/mx);}
  var g='',k,lines='',xl='';
  for(k=0;k<=4;k++){var gv=mx*k/4,gy=Y(gv);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end">'+short(gv)+'</text>';}
  for(i=0;i<12;i++)xl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">T'+(i+1)+'</text>';
  [['var(--pos)',thu,'Thu'],['var(--neg)',chi,'Chi'],['#2563eb',dt,'Tích lũy, đầu tư']].forEach(function(sr){
    var d=sr[1].slice(0,lastM).map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
    lines+='<path d="'+d+'" fill="none" stroke="'+sr[0]+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    sr[1].slice(0,lastM).forEach(function(v,i){lines+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.6" fill="var(--surface)" stroke="'+sr[0]+'" stroke-width="2"><title>'+sr[2]+' T'+(i+1)+': '+money(v)+'</title></circle>';});
  });
  return '<div class="stats" style="margin:0 0 6px"><span><i class="sw" style="background:var(--pos)"></i>Thu</span><span><i class="sw" style="background:var(--neg)"></i>Chi</span><span><i class="sw" style="background:#2563eb"></i>Tích lũy, đầu tư</span></div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Xu hướng thu chi năm '+y+'">'+g+lines+xl+'</svg>';
}
function viewHome(){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,pm=m-1,py=y;if(pm<1){pm=12;py--;}
  var ml=periodList(y,m,'month'),pl=periodList(py,pm,'month');
  var thu=sum(ofType(ml,'thu')),chi=sum(chiAll(ml)),dt=sum(ofType(ml,'dautu')),net=thu-chi;
  var recent=S.tx.slice().sort(function(a,b){return key(a)<key(b)?1:-1;}).slice(0,6);
  var h=sampleBanner()+backupNudge();
  h+='<section class="card entry"><div class="r"><input type="text" id="q" placeholder="Nhập khoản thu chi" autocomplete="off" enterkeyhint="done" aria-label="Nhập khoản thu chi"><button class="micb" data-act="mic" aria-label="Nói để nhập">'+icon('mic',22)+'</button><button class="go" data-act="add">Ghi</button></div><div class="pv" id="pv"></div></section>';
  h+='<div class="sc3">'+scard('g1','Số dư hiện tại',money(balanceNow()),(net>=0?'↑ ':'↓ ')+sgn(net)+' trong tháng '+m,'wallet')+scard('g2','Thu tháng '+m,money(thu),cmpTxt(thu,sum(ofType(pl,'thu'))),'trend')+scard('g3','Chi tháng '+m,money(chi),'Gồm tích lũy, đầu tư: '+short(dt),'card')+'</div>';
  h+='<div class="row2"><section class="card"><div class="sec-h"><div><h2>Giao dịch gần đây</h2><small>Các khoản mới ghi gần nhất</small></div><button class="link" data-act="nav" data-v="tx">Xem tất cả →</button></div>'+
    (recent.length?TH+'<div class="trs">'+recent.map(trow).join('')+'</div>':'<div class="empty">Chưa có giao dịch. Bấm micro hoặc gõ khoản đầu tiên.</div>')+'</section>'+
    '<section class="card"><div class="sec-h"><div><h2>Thu chi 6 tháng</h2><small>Xanh là thu, đỏ là chi</small></div></div>'+barMini(6)+'</section></div>';
  h+='<div class="row3"><section class="card"><h2>Cơ cấu chi tháng '+m+'</h2>'+chiShare(ml)+'</section><section class="card"><h2>Xu hướng năm '+y+'</h2>'+lineTrend(y)+'</section></div>';
  return h;
}
function periodLabel(){return S.mode==='year'?'Năm '+S.y:'Tháng '+S.m+'/'+S.y;}
function viewAnalytics(){
  var list=periodList(S.y,S.m,S.mode),thuL=ofType(list,'thu'),chiL=chiAll(list);
  var thu=sum(thuL),chi=sum(chiL),dt=sum(ofType(list,'dautu')),tl=S.tab==='thu'?thuL:chiL;
  var py=S.y,pm=S.m-1;if(S.mode==='year')py=S.y-1;else if(pm<1){pm=12;py--;}
  var pl=periodList(py,pm,S.mode),prev=sum(S.tab==='thu'?ofType(pl,'thu'):chiAll(pl)),cur=sum(tl),cmp='';
  if(prev>0){var ch=(cur-prev)/prev*100;cmp='<span class="d '+((S.tab==='chi'?ch<=0:ch>=0)?'pos':'neg')+'">'+(ch>=0?'↑':'↓')+' '+Math.abs(ch).toFixed(1).replace('.',',')+'% so với kỳ trước</span>';}
  var name=S.tab==='thu'?'Tổng thu':'Tổng chi (gồm tích lũy, đầu tư, trả nợ)',net=thu-chi;
  return '<div class="period"><div class="pills" role="group" aria-label="Chế độ xem"><button data-act="mode" data-v="month" aria-pressed="'+(S.mode==='month')+'">Theo tháng</button><button data-act="mode" data-v="year" aria-pressed="'+(S.mode==='year')+'">Theo năm</button></div>'+
    '<div class="nav"><button data-act="prev" aria-label="Kỳ trước">'+icon('left',16)+'</button><b>'+periodLabel()+'</b><button data-act="next" aria-label="Kỳ sau">'+icon('right',16)+'</button></div></div>'+
    '<div class="sc3">'+scard('g1','Thu',money(thu),periodLabel(),'trend')+scard('g3','Chi',money(chi),'Trong đó tích lũy, đầu tư: '+short(dt),'card')+scard('g2','Còn lại trong kỳ',sgn(net),net>=0?'Thu nhiều hơn chi':'Chi nhiều hơn thu','wallet')+'</div>'+
    '<div class="an"><section class="card"><div class="pills" style="margin-bottom:12px">'+['chi','thu'].map(function(t){return '<button data-act="tab" data-v="'+t+'" aria-pressed="'+(S.tab===t)+'">'+TYPE_NAME[t]+'</button>';}).join('')+'</div>'+
    '<div class="tot"><div class="l">'+name+'</div><div class="v">'+money(cur)+'</div>'+cmp+'</div>'+donut(tl,S.tab)+'</section>'+
    '<div class="stackc"><section class="card"><h2>Thu chi theo tháng</h2>'+barChart()+'</section><section class="card"><h2>Xu hướng năm '+S.y+'</h2>'+lineTrend(S.y)+'</section></div></div>';
}
function txFiltered(){
  var f=S.txf,q=norm(S.q||'');
  return S.tx.filter(function(t){return (f==='all'||t.type===f)&&(!q||norm(t.note+' '+t.cat+' '+(t.memo||'')).indexOf(q)>=0);}).sort(function(a,b){return key(a)<key(b)?1:-1;});
}
function txParts(){
  var all=txFiltered(),shown=all.slice(0,300),cur='',body='';
  shown.forEach(function(t){if(t.date!==cur){cur=t.date;body+='<div class="grp">'+dayLabel(cur)+'</div>';}body+=trow(t);});
  return {sum:'<span>'+all.length+' khoản</span><span>Thu <b class="pos">'+money(sum(ofType(all,'thu')))+'</b></span><span>Chi <b class="neg">'+money(sum(chiAll(all)))+'</b></span>',
    list:shown.length?TH+'<div class="trs">'+body+'</div>':'<div class="empty">Không có giao dịch phù hợp.</div>'};
}
function partialTx(){var p=txParts(),a=document.getElementById('txlist'),b=document.getElementById('sumrow');if(a)a.innerHTML=p.list;if(b)b.innerHTML=p.sum;}
function viewTx(){
  var p=txParts();
  return '<section class="card"><div class="sec-h"><div><h2>Giao dịch</h2><small>Bấm vào một khoản để sửa nhóm, ngày giờ, ghi chú</small></div></div>'+
    '<div class="toolbar"><input type="search" id="sq" class="sq" placeholder="Tìm theo tên, nhóm, ghi chú" value="'+esc(S.q||'')+'" aria-label="Tìm giao dịch"><div class="pills">'+[['all','Tất cả'],['thu','Thu'],['chi','Chi'],['dautu','Đầu tư']].map(function(x){return '<button data-act="txf" data-v="'+x[0]+'" aria-pressed="'+(S.txf===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="sumrow" id="sumrow">'+p.sum+'</div><div id="txlist">'+p.list+'</div></section>';
}
function viewInv(){
  var inv=ofType(S.tx,'dautu').filter(function(t){return t.cat!=='Trả nợ';}).sort(function(a,b){return key(a)<key(b)?1:-1;});
  if(!inv.length)return sampleBanner()+'<section class="card"><div class="empty">Chưa có khoản đầu tư. Thử nói “mua vàng 5 triệu” hoặc “gửi tiết kiệm 20 củ”.</div></section>';
  var cost=sum(inv),val=investValue(),pl=val-cost,by={};
  inv.forEach(function(t){var b=by[t.cat]||(by[t.cat]={c:0,v:0});b.c+=t.amount;b.v+=(t.cur!=null?t.cur:t.amount);});
  var cats=Object.keys(by).sort(function(a,b){return by[b].v-by[a].v;});

  var now=Date.now(),tomb={};

  Object.keys(meta.del||{}).forEach(function(k){if((meta.del[k]||0)>(tomb[k]||0))tomb[k]=meta.del[k];});
  Object.keys(tomb).forEach(function(k){if(now-tomb[k]>120*864e5)delete tomb[k];});
  var map={};S.tx.forEach(function(t){map[t.id]=t;});
  remoteTx.forEach(function(r){if(!r||!r.id)return;var l=map[r.id];if(!l||(r.u||0)>(l.u||0))map[r.id]=r;});
  var out=[];Object.keys(map).forEach(function(id){var t=map[id];if(tomb[id]&&tomb[id]>=(t.u||0))return;out.push(fixTx(t));});
  var rmap={};REC.forEach(function(r){rmap[r.id]=r;});
  (meta.rec||[]).forEach(function(r){if(!r||!r.id)return;var l=rmap[r.id];
    if(!l)rmap[r.id]=r;

  var cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey)return;
  SY.cfg=true;
  var base='https://www.gstatic.com/firebasejs/10.12.2/',ready=window.firebase?Promise.resolve():loadScript(base+'firebase-app-compat.js').then(function(){return loadScript(base+'firebase-auth-compat.js');}).then(function(){return loadScript(base+'firebase-firestore-compat.js');});
  ready.then(function(){
    firebase.initializeApp(cfg);SY.auth=firebase.auth();
    try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
    SY.auth.onAuthStateChanged(function(u){if(u)startSync(u);else stopSync();});
  },function(){SY.err='Không tải được thư viện đồng bộ. Kiểm tra kết nối mạng.';syncUi();});
}
function syncCard(){
  var h='<section class="card"><div class="sec-h"><div><h2>Đồng bộ nhiều thiết bị</h2><small>Điện thoại và laptop dùng chung một sổ, có bản lưu trên đám mây</small></div></div>';
  if(!SY.cfg)h+='<p class="hint">Chưa bật. Làm theo file HUONG-DAN-DONG-BO.md trong gói web để dán cấu hình Firebase miễn phí của bạn, rồi đăng lại trang.</p>';
  else if(!SY.on)h+='<p class="hint">Đăng nhập Google để sổ tự lưu lên tài khoản của bạn và đồng bộ giữa các thiết bị. Dữ liệu trên máy này được giữ và gộp vào, không bị ghi đè.</p><div class="bk-row"><button class="go" style="padding:10px 20px" data-act="cloudin">Đăng nhập Google</button></div>';
  else h+='<div class="st"><span>Tài khoản: <b>'+esc(SY.email||'đã đăng nhập')+'</b></span><span>Đồng bộ lần cuối: <b>'+(SY.last?new Date(SY.last).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'đang đồng bộ…')+'</b></span></div><div class="bk-row"><button class="ghost" data-act="cloudnow">Đồng bộ ngay</button><button class="ghost" data-act="cloudout">Đăng xuất</button></div>';
  if(SY.err)h+='<p class="hint" style="color:var(--neg)">'+esc(SY.err)+'</p>';
  return h+'</section>';
}
function syncUi(){var el=document.getElementById('synccard');if(el)el.innerHTML=syncCard();}
var impArmed=false;
function backupText(){return JSON.stringify({v:2,tx:S.tx,rec:REC});}
function importText(txt){
  try{var d=JSON.parse(txt),dr=[];if(!Array.isArray(d)){dr=Array.isArray(d.rec)?d.rec:[];d=d.tx;}if(!Array.isArray(d))return -1;
    S.tx=d.filter(function(t){return t&&t.type&&t.date&&t.amount>=0;}).map(function(t){t.id=t.id||uid();return fixTx(t);});REC=dr;saveRec();save();return S.tx.length;}catch(e){return -1;}
}
function exportFile(){
  var name='so-thu-chi-'+today()+'.json',txt=backupText();
  function fallback(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();toast('Đã tải file sao lưu.');}catch(e){toast('Không tải được file. Hãy dùng nút Sao chép dữ liệu.');}}
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(d){if(!d){fallback();return;}d.save({filename:name,data:txt}).then(function(){markBackup();toast('Đã lưu file sao lưu.');},function(e){if(!e||e.code!=='declined')toast('Không lưu được file. Hãy dùng nút Sao chép dữ liệu.');});},fallback);}
  else fallback();
}
function findTx(id){return S.tx.filter(function(x){return x.id===id;})[0];}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='add')submit();
  else if(a==='mic')mic();
  else if(a==='nav'){S.view=b.getAttribute('data-v');S.edit=null;S.sel=null;impArmed=false;render();window.scrollTo(0,0);}
  else if(a==='mode'){S.mode=b.getAttribute('data-v');S.sel=null;render();}
  else if(a==='tab'){S.tab=b.getAttribute('data-v');S.sel=null;render();}
  else if(a==='txf'){S.txf=b.getAttribute('data-v');S.edit=null;render();}
  else if(a==='prev'){shiftPeriod(-1);render();}
  else if(a==='next'){shiftPeriod(1);render();}
  else if(a==='sel'){var c=b.getAttribute('data-cat');S.sel=S.sel===c?null:c;S.edit=null;render();var dt0=document.getElementById('detail');if(dt0)dt0.scrollIntoView({behavior:'smooth',block:'nearest'});}
  else if(a==='edit'){var id0=b.getAttribute('data-id');S.edit=S.edit===id0?null:id0;render();}
  else if(a==='del'){var id=b.getAttribute('data-id');S.tx=S.tx.filter(function(t){return t.id!==id;});S.edit=null;save();render();toast('Đã xóa khoản này.');}
  else if(a==='undo'){S.tx=S.tx.filter(function(t){return lastIds.indexOf(t.id)<0;});lastIds=[];save();render();document.getElementById('toast').innerHTML='';}
  else if(a==='pickm'){S.mode='month';S.m=+b.getAttribute('data-m');S.sel=null;render();}
  else if(a==='radd'){
    var rn=document.getElementById('rn').value.trim(),ra=parseAmount(document.getElementById('ra').value||''),rd=Math.max(1,Math.min(31,parseInt(document.getElementById('rd').value,10)||1)),rc=document.getElementById('rc').value;
    if(!ra){toast('Nhập số tiền cho khoản định kỳ.');return;}
    REC.push({id:uid(),name:rn||rc,amount:Math.round(ra),day:rd,cat:rc,on:true,since:today().slice(0,7),done:[]});saveRec();render();toast('Đã thêm khoản thu định kỳ.');}
  else if(a==='rdel'){var rid=b.getAttribute('data-id');REC=REC.filter(function(r){return r.id!==rid;});saveRec();render();toast('Đã xóa khoản định kỳ. Các khoản đã nhập vẫn được giữ.');}
  else if(a==='sample')sampleData();
  else if(a==='clearsample'){S.tx=S.tx.filter(function(t){return !t.sample;});save();render();toast('Đã xóa dữ liệu mẫu.');}
  else if(a==='cloudin'){if(SY.auth){SY.err='';SY.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){SY.err='Đăng nhập chưa thành công ('+((e&&e.code)||'lỗi')+'). Kiểm tra tên miền đã được cho phép trong Firebase.';syncUi();});}}
  else if(a==='cloudout'){if(SY.auth)SY.auth.signOut();}
  else if(a==='cloudnow'){SY.last=0;syncUi();pushIfNeeded();setTimeout(function(){SY.last=SY.last||Date.now();syncUi();},800);}
  else if(a==='abrestore'){var k=b.getAttribute('data-k');if(b.getAttribute('data-arm')!=='1'){b.setAttribute('data-arm','1');b.textContent='Bấm lần nữa để thay thế sổ hiện tại';return;}
    abOpen(function(db){if(!db)return;db.transaction('s').objectStore('s').get(k).onsuccess=function(e){var r=e.target.result;if(!r)return;var n=importText(r.json);if(n<0)toast('Bản tự lưu không hợp lệ.');else{render();toast('Đã khôi phục '+n+' giao dịch.');}};});}
  else if(a==='dl')exportFile();
  else if(a==='copybk'){var ta=document.getElementById('bk');ta.select();
    var ok=function(){markBackup();toast('Đã sao chép dữ liệu. Hãy dán vào một nơi an toàn.');},no=function(){try{document.execCommand('copy');ok();}catch(e){toast('Hãy chọn và sao chép thủ công.');}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(ok,no);else no();}
  else if(a==='impbk'){
    if(!impArmed){impArmed=true;b.textContent='Bấm lần nữa để thay thế toàn bộ';return;}
    var n=importText(document.getElementById('bk').value);impArmed=false;
    if(n<0){toast('Dữ liệu không hợp lệ.');b.textContent='Nạp dữ liệu từ ô trên';}else{render();toast('Đã nạp '+n+' giao dịch.');}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=el.getAttribute&&el.getAttribute('data-act');
  if(el.id==='bkfile'){var f=el.files&&el.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var n=importText(String(fr.result));if(n<0)toast('File không hợp lệ.');else{markBackup();render();toast('Đã nạp '+n+' giao dịch từ file.');}};fr.readAsText(f);return;}
  if(!a)return;
  if(/^r(name|amt|day|cat|on)$/.test(a)){
    var rr=REC.filter(function(x){return x.id===el.getAttribute('data-id');})[0];if(!rr)return;
    if(a==='rname')rr.name=el.value.trim()||rr.name;
    else if(a==='ramt'){var na=parseAmount(el.value);if(na)rr.amount=Math.round(na);}
    else if(a==='rday')rr.day=Math.max(1,Math.min(31,parseInt(el.value,10)||1));
    else if(a==='rcat')rr.cat=el.value;
    else if(a==='ron'){rr.on=el.checked;if(rr.on){rr.since=today().slice(0,7);}}
    saveRec();render();return;
  }
  var t=findTx(el.getAttribute('data-id'));if(!t)return;
  try{if(document.activeElement===el)el.blur();}catch(e){}
  if(a==='cat'){var p=el.value.split('|');t.type=p[0];t.cat=p[1];if(t.type!=='dautu')delete t.cur;save();render();}
  else if(a==='note'){var nv=el.value.trim();if(nv){t.note=nv;save();render();}}
  else if(a==='amt'){var na2=parseAmount(el.value);if(!na2){toast('Chưa hiểu số tiền.');return;}t.amount=Math.round(na2);save();render();toast('Đã cập nhật khoản này.');}
  else if(a==='date'){if(el.value){t.date=el.value;save();render();}}
  else if(a==='time'){if(el.value){t.time=el.value;save();render();}}
  else if(a==='memo'){t.memo=el.value.trim();if(!t.memo)delete t.memo;save();render();}
  else if(a==='cur'){var v=el.value.trim();if(!v)delete t.cur;else{var n=parseAmount(v);if(n==null){toast('Chưa hiểu số tiền.');return;}t.cur=n;}save();render();}
});
document.addEventListener('input',function(ev){if(ev.target.id==='q')preview();else if(ev.target.id==='sq'){S.q=ev.target.value;partialTx();}});
document.addEventListener('keydown',function(e){if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();submit();}});
document.getElementById('logo').innerHTML=icon('leaf',30);
document.getElementById('logo2').innerHTML=icon('leaf',22);
document.getElementById('hb1').innerHTML=icon('repeat',20);
document.getElementById('hb2').innerHTML=icon('save',20);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
load();loadRec();loadDel();initSnap();render();initCloud();
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
